# PCT 点云地图清洗参数文件。
# 固定处理顺序：删除非法点 → SOR → ROR → 小型浮空点团过滤 → 空间均匀降采样。
# 本工具只删除原始点，不生成新点、不移动点、不补点。

# 输入 LIO-SAM 最终地图的 PCD 文件路径。
# 支持绝对路径和相对路径；命令行 --input 的优先级高于此参数。
input_pcd: "/home/wa/inspection/3D_motion_planner/motion_planner/src/pct_planner/rsc/pcd/cloudGlobal.pcd"

# 清洗后 PCD 地图的保存路径。
# 支持绝对路径和相对路径；命令行 --output 的优先级高于此参数。
output_pcd: "/home/wa/inspection/3D_motion_planner/motion_planner/src/pct_planner/rsc/pcd/GlobalMap_pct_clean03.pcd"


sor:
  # SOR 开关：true 执行 Statistical Outlier Removal，false 跳过该阶段。
  enable: true

  # 计算每个点平均邻域距离时使用的邻居数量。
  # 增大：统计结果更平滑，但稀疏结构更容易被判为异常。
  # 减小：更关注局部变化，但统计结果更容易受噪声影响。
  # 楼梯边缘、栏杆、细杆和远距离墙面建议使用保守值。
  nb_neighbors: 30

  # SOR 标准差阈值倍数，无单位。
  # 点的平均邻域距离明显超过全局均值时可能被删除。
  # 减小：删除更多统计异常点，但误删稀疏真实结构的风险更高。
  # 增大：过滤更保守，可能保留更多异常点。
  std_ratio: 2.5


ror:
  # ROR 开关：true 执行 Radius Outlier Removal，false 跳过该阶段。
  enable: true

  # 半径邻域内要求存在的邻居点数量。
  # 增大：孤立点和稀疏点更容易被删除，过滤更激进。
  # 减小：保留更多稀疏结构，但可能残留游离点。
  nb_points: 5

  # 邻域搜索半径，单位：米。
  # 半径太小：栏杆、细杆、楼梯边缘和远处稀疏结构更容易被误删。
  # 半径太大：孤立点可能找到较远邻居而被保留。
  # 应结合原始点云平均点间距调整，不建议盲目修改。
  radius: 0.10


floating_cluster:
  # 浮空点团开关：true 执行 DBSCAN 点团分析，false 跳过该阶段。
  enable: true

  # DBSCAN 邻域半径，单位：米。
  # 两点距离不超过 eps 时，才可能属于同一密度邻域。
  # 太小：真实点团可能被拆成多个 cluster。
  # 太大：相邻的不同结构可能被错误合并。
  eps: 0.15

  # DBSCAN 核心点所需的最小邻居数量。
  # 减小：较稀疏的点团更容易形成 cluster。
  # 增大：更多点会被标记为 noise（label=-1）。
  # 程序不会自动删除所有 label=-1 点，以保护合法稀疏结构。
  min_points: 3

  # 小型 cluster 的点数上限，删除条件为 point_count < 此值。
  # 增大：可以删除点数更多的游离点团，但误删风险增加。
  # 减小：更保守，只删除很小的点团。
  remove_if_point_count_below: 30

  # cluster 在 X 方向的包围盒尺寸上限，单位：米。
  # 删除时必须满足 dx < max_bbox_x。
  max_bbox_x: 0.30

  # cluster 在 Y 方向的包围盒尺寸上限，单位：米。
  # 删除时必须满足 dy < max_bbox_y。
  max_bbox_y: 0.30

  # cluster 在 Z 方向的包围盒尺寸上限，单位：米。
  # 删除时必须满足 dz < max_bbox_z。
  max_bbox_z: 0.30

  # 是否保存被删除的浮空点团。
  # true：保存为 removed_floating_clusters.pcd，便于 CloudCompare 检查。
  # false：仍执行删除，但不保存该 removed 文件。
  save_removed_clusters: true

  # 实际删除条件：以下四个条件必须同时满足。
  #   point_count < remove_if_point_count_below
  #   dx < max_bbox_x
  #   dy < max_bbox_y
  #   dz < max_bbox_z
  # 不会只保留最大 cluster，也不会因为结构与主体不连接就删除它。


uniform_sampling:
  # 均匀降采样开关：true 执行 voxel 采样，false 保持过滤后的点云。
  enable: true

  # 3D voxel 边长，单位：米。
  # 每个 voxel 最多保留一个原始点，并保留距离 voxel 中心最近的原始点。
  # 不使用 voxel centroid，不计算平均值，不生成新点，不移动原始点。
  # 增大：点云更稀疏、文件更小，但可能降低 PCT tomography 连续性。
  # 减小：结构保留更多，但点数、文件大小和计算量增加。
  # 当前 PCT pct.map.resolution = 0.10 m，推荐 spacing = 0.05 m。
  # 如果 PCT resolution 修改，请手动同步修改 spacing。
  spacing: 0.05


debug:
  # 是否保存处理阶段的中间点云。
  # true：保存各阶段点云以及 SOR、ROR、浮空点团 removed 点云。
  # false：不保存阶段中间文件，但仍保存最终 output_pcd。
  save_intermediate: true

  # 中间点云和 removed 点云的输出目录。
  # 相对路径相对于运行脚本时的当前工作目录，不是 YAML 文件所在目录。
  output_directory: "./pct_map_cleaner_debug"
